name: Public settings format once

on:
  push:
    branches:
      - agent/16-public-location-settings
    paths:
      - 'lib/infrastructure/platform/app_platform.dart'
      - 'test/infrastructure/app_platform_test.dart'
      - '.github/workflows/public-settings-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/16-public-location-settings
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply formatter to the public-settings Dart slice only
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/infrastructure/platform/app_platform.dart \
            test/infrastructure/app_platform_test.dart
          git diff --check
          if git diff --quiet -- \
            lib/infrastructure/platform/app_platform.dart \
            test/infrastructure/app_platform_test.dart; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/infrastructure/platform/app_platform.dart \
            test/infrastructure/app_platform_test.dart
          git commit -m 'style: format public settings boundary'
          git push origin HEAD:agent/16-public-location-settings
