name: Apply issue21 places UI patch

on:
  push:
    branches:
      - agent/21-place-merge-split
    paths:
      - '.github/scripts/patch_issue21_places_ui.py'
      - '.github/workflows/apply-issue21-places-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/21-place-merge-split
      - run: python3 .github/scripts/patch_issue21_places_ui.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: dart format lib/features/places/places_screen.dart
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/places/places_screen.dart
          git rm .github/scripts/patch_issue21_places_ui.py .github/workflows/apply-issue21-places-ui.yml
          git commit -m 'feat: add place merge and split review UI'
          git push origin HEAD:agent/21-place-merge-split
