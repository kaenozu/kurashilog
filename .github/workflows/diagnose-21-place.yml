name: Diagnose place privacy contracts

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect source
        run: |
          find lib test -type f | sort | grep -E 'cluster|place|privacy|override|evidence|database|repository'
          echo '=== symbols ==='
          grep -R -n -E 'class .*Cluster|class .*Place|Override|private|excluded|sourceKey|clusterId' lib test | head -n 700 || true
