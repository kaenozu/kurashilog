name: Comparison format apply

on:
  push:
    branches:
      - agent/18-comparison-domain
    paths:
      - 'lib/domain/models/comparison.dart'
      - 'lib/domain/services/comparison_service.dart'
      - 'test/domain/comparison_service_test.dart'
      - '.github/workflows/comparison-format-preview.yml'

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/18-comparison-domain
          fetch-depth: 0
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply formatter to the comparison slice only
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/domain/models/comparison.dart \
            lib/domain/services/comparison_service.dart \
            test/domain/comparison_service_test.dart
          git diff --check
          if git diff --quiet -- \
            lib/domain/models/comparison.dart \
            lib/domain/services/comparison_service.dart \
            test/domain/comparison_service_test.dart; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/domain/models/comparison.dart \
            lib/domain/services/comparison_service.dart \
            test/domain/comparison_service_test.dart
          git commit -m 'style: format comparison domain'
          git push origin HEAD:agent/18-comparison-domain
