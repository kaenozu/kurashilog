name: Apply issue21 evidence UI patch

on:
  push:
    branches:
      - agent/21-insight-evidence-drilldown
    paths:
      - '.github/scripts/patch_issue21_evidence_ui.py'
      - '.github/workflows/apply-issue21-evidence-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/21-insight-evidence-drilldown
      - run: python3 .github/scripts/patch_issue21_evidence_ui.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: dart format lib/application/use_cases/dashboard_use_case.dart lib/features/month_story/month_story_screen.dart lib/application/use_cases/insight_evidence_use_case.dart lib/features/month_story/insight_evidence_screen.dart lib/application/providers.dart
      - name: Commit patch and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/application/use_cases/dashboard_use_case.dart lib/features/month_story/month_story_screen.dart lib/application/use_cases/insight_evidence_use_case.dart lib/features/month_story/insight_evidence_screen.dart lib/application/providers.dart
          git rm .github/scripts/patch_issue21_evidence_ui.py .github/workflows/apply-issue21-evidence-ui.yml
          git commit -m 'feat: add insight evidence drilldown'
          git push origin HEAD:agent/21-insight-evidence-drilldown
