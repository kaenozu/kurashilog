name: One-shot validate onboarding setup

on:
  pull_request:
    branches:
      - agent/16-public-location-settings
    paths:
      - '.github/workflows/one-shot-format-16-onboarding.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/16-onboarding-setup-flow
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Format and validate
        run: |
          # v3: Flutter 3.44 lifecycle hooks are synchronous.
          rm .github/workflows/one-shot-format-16-onboarding.yml
          dart format \
            lib/features/onboarding/onboarding_screen.dart \
            lib/features/onboarding/onboarding_setup_panel.dart \
            test/features/onboarding/onboarding_setup_test.dart
          flutter pub get
          flutter test test/features/onboarding/onboarding_setup_test.dart
          git diff --check
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: validate the beginner timeline setup flow'
          git push origin HEAD:agent/16-onboarding-setup-flow
