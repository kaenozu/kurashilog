name: One-shot integrate place privacy persistence

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-21-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/21-place-privacy-domain
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Integrate repository contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if text.count(old) < count:
                  raise SystemExit(f'{path}: pattern not found: {old[:80]}')
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          replace(
              'lib/infrastructure/database/kurashilog_repository_impl.dart',
              "            excluded: existing?.excluded ?? false,\n",
              "            excluded: existing?.excluded ?? false,\n"
              "            privacyMode: PlacePrivacyMode.parse(\n"
              "              existing?.privacyMode ?? 'visible',\n"
              "              legacyExcluded: existing?.excluded ?? false,\n"
              "            ),\n",
          )
          replace(
              'lib/infrastructure/database/kurashilog_repository_impl.dart',
              "        excluded: Value(cluster.excluded),\n",
              "        excluded: Value(cluster.excludedFromAnalysis),\n"
              "        privacyMode: Value(cluster.privacyMode.name),\n",
          )
          replace(
              'lib/infrastructure/database/kurashilog_repository_impl.dart',
              "    excluded: cluster.excluded,\n",
              "    excluded: cluster.excluded,\n"
              "    privacyMode: PlacePrivacyMode.parse(\n"
              "      cluster.privacyMode,\n"
              "      legacyExcluded: cluster.excluded,\n"
              "    ),\n",
          )
          replace(
              'lib/infrastructure/database/kurashilog_repository_impl.dart',
              "  @override\n  Future<void> setClusterExcluded(int clusterId, bool excluded) async {\n"
              "    final updated =\n"
              "        await (_db.update(_db.placeClusters)\n"
              "              ..where((table) => table.id.equals(clusterId)))\n"
              "            .write(PlaceClustersCompanion(excluded: Value(excluded)));\n"
              "    if (updated != 1) throw StateError('Cluster $clusterId was not found');\n"
              "  }\n",
              "  @override\n  Future<void> setClusterExcluded(int clusterId, bool excluded) =>\n"
              "      setClusterPrivacyMode(\n"
              "        clusterId,\n"
              "        excluded ? PlacePrivacyMode.exclude : PlacePrivacyMode.visible,\n"
              "      );\n\n"
              "  @override\n  Future<void> setClusterPrivacyMode(\n"
              "    int clusterId,\n"
              "    PlacePrivacyMode privacyMode,\n"
              "  ) async {\n"
              "    final updated =\n"
              "        await (_db.update(_db.placeClusters)\n"
              "              ..where((table) => table.id.equals(clusterId)))\n"
              "            .write(\n"
              "              PlaceClustersCompanion(\n"
              "                excluded: Value(privacyMode == PlacePrivacyMode.exclude),\n"
              "                privacyMode: Value(privacyMode.name),\n"
              "              ),\n"
              "            );\n"
              "    if (updated != 1) throw StateError('Cluster $clusterId was not found');\n"
              "  }\n",
          )
          replace(
              'lib/infrastructure/database/correction_preserving_repository.dart',
              "      await setClusterExcluded(cluster.id, correction?.excluded ?? false);\n",
              "      await setClusterPrivacyMode(\n"
              "        cluster.id,\n"
              "        correction?.privacyMode ??\n"
              "            ((correction?.excluded ?? false)\n"
              "                ? PlacePrivacyMode.exclude\n"
              "                : PlacePrivacyMode.visible),\n"
              "      );\n",
          )
          replace(
              'lib/infrastructure/database/resettable_kurashilog_repository.dart',
              "  @override\n  Future<void> setClusterExcluded(int clusterId, bool excluded) =>\n"
              "      _run((repository) => repository.setClusterExcluded(clusterId, excluded));\n",
              "  @override\n  Future<void> setClusterExcluded(int clusterId, bool excluded) =>\n"
              "      _run((repository) => repository.setClusterExcluded(clusterId, excluded));\n\n"
              "  @override\n  Future<void> setClusterPrivacyMode(\n"
              "    int clusterId,\n"
              "    PlacePrivacyMode privacyMode,\n"
              "  ) => _run(\n"
              "    (repository) => repository.setClusterPrivacyMode(clusterId, privacyMode),\n"
              "  );\n",
          )
          replace(
              'lib/application/use_cases/places_use_case.dart',
              "  Future<void> setExcluded(int clusterId, bool excluded) async {\n"
              "    await repository.setClusterExcluded(clusterId, excluded);\n"
              "    await analysis.rebuildSummariesAndInsights();\n"
              "  }\n",
              "  Future<void> setExcluded(int clusterId, bool excluded) => setPrivacyMode(\n"
              "    clusterId,\n"
              "    excluded ? PlacePrivacyMode.exclude : PlacePrivacyMode.visible,\n"
              "  );\n\n"
              "  Future<void> setPrivacyMode(\n"
              "    int clusterId,\n"
              "    PlacePrivacyMode privacyMode,\n"
              "  ) async {\n"
              "    await repository.setClusterPrivacyMode(clusterId, privacyMode);\n"
              "    await analysis.rebuildSummariesAndInsights();\n"
              "  }\n",
          )
          PY
          rm .github/workflows/diagnose-21-place.yml
          rm .github/workflows/one-shot-21-integrate.yml
          dart format \
            lib/application/models/persistence_models.dart \
            lib/application/repositories/kurashilog_repository.dart \
            lib/application/use_cases/places_use_case.dart \
            lib/domain/privacy/place_privacy.dart \
            lib/infrastructure/database/app_database.dart \
            lib/infrastructure/database/correction_preserving_repository.dart \
            lib/infrastructure/database/kurashilog_repository_impl.dart \
            lib/infrastructure/database/resettable_kurashilog_repository.dart \
            lib/infrastructure/database/tables.dart \
            test/domain/place_privacy_test.dart \
            test/infrastructure/database/correction_preserving_repository_test.dart
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter test \
            test/domain/place_privacy_test.dart \
            test/infrastructure/database/correction_preserving_repository_test.dart
          git diff --check
      - name: Commit integrated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: persist and project place privacy modes'
          git push origin HEAD:agent/21-place-privacy-domain
