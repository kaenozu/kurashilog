name: Format private acceptance once

on:
  pull_request:
    paths:
      - '.github/workflows/format-private-acceptance-once.yml'

permissions:
  contents: write

jobs:
  format-and-remove:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/private-timeline-acceptance-automation-20260805
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format harness and remove one-shot workflow
        run: |
          dart format tool/acceptance/private_timeline_acceptance_test.dart
          rm .github/workflows/format-private-acceptance-once.yml
      - name: Commit formatted harness
        run: |
          git config user.name 'ChatGPT Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'style: format private acceptance harness'
          git push origin HEAD:agent/private-timeline-acceptance-automation-20260805
