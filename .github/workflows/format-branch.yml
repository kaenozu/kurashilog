name: Format repair branch

on:
  push:
    branches:
      - agent/fix-p0-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-p0-foundation

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format Dart sources
        run: dart format lib test

      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "style: format Dart sources"
          git push origin HEAD:agent/fix-p0-foundation
