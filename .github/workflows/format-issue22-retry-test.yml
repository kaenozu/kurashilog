name: Format issue22 retry test

on:
  push:
    branches:
      - agent/22-retry-analysis-recovery
    paths:
      - '.github/workflows/format-issue22-retry-test.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/22-retry-analysis-recovery
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: dart format test/application/use_cases/import_use_case_regression_test.dart
      - name: Commit formatting and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/application/use_cases/import_use_case_regression_test.dart
          git rm .github/workflows/format-issue22-retry-test.yml
          git commit -m 'style: format import retry regression test'
          git push origin HEAD:agent/22-retry-analysis-recovery
