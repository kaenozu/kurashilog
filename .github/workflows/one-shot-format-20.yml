name: One-shot validate life journal design system

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-shot-format-20.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/20-life-journal-design-system
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - name: Format and validate
        run: |
          rm .github/workflows/one-shot-format-20.yml
          dart format lib/app/theme.dart lib/app/design_system.dart test/app/design_system_test.dart
          flutter pub get
          flutter test test/app/design_system_test.dart
          git diff --check
      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: validate the life journal design system'
          git push origin HEAD:agent/20-life-journal-design-system
