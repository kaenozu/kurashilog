name: Merge format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Show formatter diff
        shell: bash
        run: |
          dart format lib/features/milestones/milestones_screen.dart
          git diff -- lib/features/milestones/milestones_screen.dart
