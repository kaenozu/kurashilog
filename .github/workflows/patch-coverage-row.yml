name: Patch coverage row

on:
  push:
    branches:
      - agent/20-responsive-accessibility-matrix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/20-responsive-accessibility-matrix
      - run: python3 .github/scripts/patch_coverage_row.py
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: dart format lib/features/comparison/comparison_screen.dart
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/comparison/comparison_screen.dart
          git commit -m 'fix: stack comparison coverage at large text scales'
          git push origin HEAD:agent/20-responsive-accessibility-matrix
