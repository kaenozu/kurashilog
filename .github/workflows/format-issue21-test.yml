name: Format issue21 regression test

on:
  push:
    branches:
      - agent/21-place-merge-split
    paths:
      - '.github/workflows/format-issue21-test.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/21-place-merge-split
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - run: dart format test/application/use_cases/places_use_case_test.dart
      - name: Commit formatted test and remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/application/use_cases/places_use_case_test.dart
          git rm .github/workflows/format-issue21-test.yml
          git commit -m 'test: format place merge regressions'
          git push origin HEAD:agent/21-place-merge-split
