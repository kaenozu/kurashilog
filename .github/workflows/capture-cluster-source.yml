name: Apply cluster correction fix

on:
  push:
    branches:
      - agent/1-cluster-one-to-one-20260804

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      REPOSITORY_IMPL_GZ_B64: 
      REPOSITORY_TEST_GZ_B64: 
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Apply, format, and verify cluster fix
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$REPOSITORY_IMPL_GZ_B64" | base64 --decode | gzip --decompress > lib/infrastructure/database/kurashilog_repository_impl.dart
          printf '%s' "$REPOSITORY_TEST_GZ_B64" | base64 --decode | gzip --decompress > test/infrastructure/database/kurashilog_repository_impl_test.dart
          dart format lib/infrastructure/database/kurashilog_repository_impl.dart test/infrastructure/database/kurashilog_repository_impl_test.dart
          flutter pub get
          flutter analyze
          flutter test
          rm .github/workflows/capture-cluster-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/infrastructure/database/kurashilog_repository_impl.dart test/infrastructure/database/kurashilog_repository_impl_test.dart .github/workflows/capture-cluster-source.yml
          git commit -m 'fix: preserve cluster corrections one-to-one'
          git push origin HEAD:agent/1-cluster-one-to-one-20260804
