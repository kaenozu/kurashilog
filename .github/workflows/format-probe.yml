name: Format probe

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Show formatter diff
        shell: bash
        run: |
          dart format lib/application/use_cases/milestones_use_case.dart lib/features/milestones/milestones_screen.dart test/application/use_cases/milestones_use_case_test.dart
          git diff -- lib/application/use_cases/milestones_use_case.dart lib/features/milestones/milestones_screen.dart test/application/use_cases/milestones_use_case_test.dart
