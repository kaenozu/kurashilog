name: Flutter CI

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore missing Flutter wrapper files
        shell: bash
        run: |
          flutter create --platforms=android --project-name kurashilog .
          rm -f test/widget_test.dart

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Assert release manifest has no INTERNET permission
        shell: bash
        run: |
          manifest="$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)"
          test -n "$manifest"
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo "Release manifest unexpectedly contains INTERNET permission: $manifest"
            exit 1
          fi
