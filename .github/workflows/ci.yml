name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/9-built-in-kotlin-20260805
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Refresh dependency resolution
        run: |
          flutter pub get
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Verify migration
        shell: bash
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build apk --debug
          flutter build apk --release
          manifest="$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)"
          test -n "$manifest"
          ! grep -q 'android.permission.INTERNET' "$manifest"
          ! grep -R --line-number -E 'org\.jetbrains\.kotlin\.android|kotlin-android' android/app android/settings.gradle.kts
          ! grep -q '^  jni:' pubspec.lock
          git diff --check

      - name: Commit verified migration
        shell: bash
        run: |
          git config user.name 'ChatGPT Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: migrate to built-in Kotlin [agent-applied]'
          git push origin HEAD:agent/9-built-in-kotlin-20260805
