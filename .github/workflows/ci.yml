name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/8-import-analysis-integration-20260805
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply staged integration test
        shell: bash
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('.github/workflows/agent-8-apply.yml')
          source = path.read_text(encoding='utf-8')
          start_marker = "          mkdir -p test/integration\n"
          start = source.index(start_marker)
          end = source.index("\n      - name: Verify changes", start)
          shell = textwrap.dedent(source[start:end])
          import subprocess
          subprocess.run(['bash', '-lc', shell], check=True)
          PY

      - name: Verify changes
        shell: bash
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test test/integration/import_analysis_pipeline_test.dart
          flutter test
          flutter build apk --debug
          flutter build apk --release
          manifest="$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)"
          test -n "$manifest"
          ! grep -q 'android.permission.INTERNET' "$manifest"
          git diff --check

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'ChatGPT Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: cover import to analysis pipeline [agent-applied]'
          git push origin HEAD:agent/8-import-analysis-integration-20260805
