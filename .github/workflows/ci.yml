name: Flutter CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/7-week-distance-settings-20260805
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply settings consistency changes
        run: python3 .github/agent-apply-7.py

      - name: Verify
        shell: bash
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
          dart format lib test
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test test/application/display_preferences_test.dart
          flutter test
          flutter build apk --debug
          flutter build apk --release
          manifest="$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)"
          test -n "$manifest"
          ! grep -q 'android.permission.INTERNET' "$manifest"
          git diff --check

      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name 'ChatGPT Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: apply week and distance settings consistently [agent-applied]'
          git push origin HEAD:agent/7-week-distance-settings-20260805
