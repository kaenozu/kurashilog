name: Agent PR26 refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/1-physical-reset-refresh-20260805
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply validated final PR 26 tree diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin \
            7887dbede80324941b71286f2ce417e72cc08848 \
            60866e16279fa99e25c80498aebb1f768ed3f275
          git diff --binary \
            7887dbede80324941b71286f2ce417e72cc08848 \
            60866e16279fa99e25c80498aebb1f768ed3f275 \
            -- \
            lib/app/kurashilog_app.dart \
            lib/application/providers.dart \
            lib/application/use_cases/data_management_use_case.dart \
            lib/features/settings/settings_screen.dart \
            lib/infrastructure/database/app_database.dart \
            lib/infrastructure/database/app_database_handle.dart \
            lib/infrastructure/database/correction_preserving_repository.dart \
            lib/infrastructure/database/resettable_kurashilog_repository.dart \
            lib/main.dart \
            test/infrastructure/database/app_database_handle_test.dart \
            test/infrastructure/database/correction_preserving_repository_test.dart \
            > /tmp/pr26.patch
          git apply --3way --index /tmp/pr26.patch
      - name: Verify integrated tree
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build apk --debug
          flutter build apk --release
          manifest="$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | head -n 1)"
          test -n "$manifest"
          ! grep -q 'android.permission.INTERNET' "$manifest"
          git diff --check
      - name: Commit integrated changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: physically reset database and preserve corrections'
          git push origin HEAD:agent/1-physical-reset-refresh-20260805
