name: kurashilog
description: "くらしログ - 位置履歴から生活の変化を見つけるオフライン分析アプリ"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.28.0
  # sqlite3 3.x packages native assets itself. The EOL package is intentionally
  # empty and prevents the legacy sqlite3 Android build scripts from being selected.
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  intl: ^0.20.2
  collection: ^1.19.1
  url_launcher: ^6.3.2
  crypto: ^3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.16

# jni 1.0.3 on pub.dev still applies the removed kotlin-android plugin. Pin the
# official upstream package revision where its Android build uses AGP 9 built-in
# Kotlin. Remove this override after a compatible pub.dev release is available.
dependency_overrides:
  jni:
    git:
      url: https://github.com/dart-lang/native.git
      ref: e4f7b3409a72cb80dc21cb8556e5d205353cb23b
      path: pkgs/jni

flutter:
  uses-material-design: true
